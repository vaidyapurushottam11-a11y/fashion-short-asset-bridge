name: verify-nfs-transfer-secret

on:
  push:
    paths:
      - 'automation/secret-check.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify private key secret matches public key
        env:
          NFS_TRANSFER_PRIVATE_KEY: ${{ secrets.NFS_TRANSFER_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NFS_TRANSFER_PRIVATE_KEY" || { echo 'Secret is missing or empty'; exit 1; }
          printf '%s\n' "$NFS_TRANSFER_PRIVATE_KEY" > private-key.pem
          python3 - <<'PY'
          import base64, hashlib, json, subprocess, pathlib
          data = json.load(open('automation/secret-check.json', encoding='utf-8'))
          pathlib.Path('cipher.bin').write_bytes(base64.b64decode(data['ciphertext_b64']))
          subprocess.run([
              'openssl','pkeyutl','-decrypt',
              '-inkey','private-key.pem',
              '-in','cipher.bin',
              '-pkeyopt','rsa_padding_mode:oaep',
              '-pkeyopt','rsa_oaep_md:sha256',
              '-pkeyopt','rsa_mgf1_md:sha256',
              '-out','plain.txt'
          ], check=True)
          plain = pathlib.Path('plain.txt').read_bytes()
          actual = hashlib.sha256(plain).hexdigest()
          expected = data['expected_sha256']
          if actual != expected:
              raise SystemExit('Private key did not decrypt the expected challenge')
          print('NFS_TRANSFER_PRIVATE_KEY verification PASS')
          PY
          rm -f private-key.pem cipher.bin plain.txt
